name: CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/native-core-assets.yml
      - Package.swift
      - Package.resolved
      - VERSION
      - Sources/**
      - Tests/**
      - build-support/**
      - Cargo.toml
      - Cargo.lock
      - guest/launch-service/**
      - guest/image/conjet-core/src/**
      - jetstream/**
      - network-helper/**
      - benchmarks/**
      - Formula/**
      - Casks/**
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/native-core-assets.yml
      - Package.swift
      - Package.resolved
      - VERSION
      - Sources/**
      - Tests/**
      - build-support/**
      - Cargo.toml
      - Cargo.lock
      - guest/launch-service/**
      - guest/image/conjet-core/src/**
      - jetstream/**
      - network-helper/**
      - benchmarks/**
      - Formula/**
      - Casks/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: "6.1.0"

jobs:
  native-core-assets:
    uses: ./.github/workflows/native-core-assets.yml

  swift:
    name: Swift build and test
    runs-on: macos-15
    needs: native-core-assets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: Set up Go for host networking
        uses: actions/setup-go@v5
        with:
          go-version-file: network-helper/go.mod
          cache-dependency-path: network-helper/go.sum

      - name: Show Swift version
        run: swift --version

      - name: Check whitespace
        run: git diff --check

      - name: Build Conjet
        run: swift build

      - name: Test host networking
        run: |
          go test -C network-helper ./...
          cargo test --locked --workspace

      - name: Test Conjet
        timeout-minutes: 15
        run: swift test

      - name: Build native Linux guest supervisor
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=rust-lld \
            cargo build --locked --release --target aarch64-unknown-linux-musl \
            -p conjet-launch-service --bin conjet-launchd

      - name: Download native Core assets
        uses: actions/download-artifact@v4
        with:
          name: conjet-native-core-assets
          path: native-core-assets

      - name: Stage Conjet app bundle
        run: |
          set -euo pipefail
          build-support/stage-macos-app.sh \
            --configuration release \
            --version "$(cat VERSION)" \
            --dist-dir dist \
            --native-guest target/aarch64-unknown-linux-musl/release/conjet-launchd \
            --native-core-assets native-core-assets \
            --signing-identity - \
            --entitlements build-support/conjet-release.entitlements

      - name: Create release DMG
        run: |
          set -euo pipefail
          build-support/create-macos-dmg.sh \
            --version "$(cat VERSION)" \
            --dist-dir dist \
            --arch "$(uname -m)"

      - name: Validate release DMG contents
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -name 'conjet-*-macos-*.dmg' -print -quit)"
          if [ -z "${dmg}" ]; then
            echo "missing release dmg" >&2
            exit 1
          fi
          mount_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/conjet-dmg.XXXXXX")"
          cleanup() {
            /usr/bin/hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true
            rmdir "${mount_dir}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          /usr/bin/hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmg}"
          test -d "${mount_dir}/Conjet.app"
          test -x "${mount_dir}/Conjet.app/Contents/MacOS/Conjet"
          test -x "${mount_dir}/Conjet.app/Contents/Resources/ConjetTools/conjetd"
          test -x "${mount_dir}/Conjet.app/Contents/Resources/ConjetTools/ConjetCoreVMM/Conjet Core"
          test -x "${mount_dir}/bin/conjet"
          test -x "${mount_dir}/bin/conjetd"
          test -x "${mount_dir}/bin/ConjetCoreVMM/Conjet Core"
          test -x "${mount_dir}/bin/ConjetCoreVMM/conjet-network"
          guest="Contents/Resources/ConjetTools/ConjetCoreVMM/conjet-launchd-linux-arm64"
          cmp "${mount_dir}/Conjet.app/${guest}" "${mount_dir}/bin/ConjetCoreVMM/conjet-launchd-linux-arm64"
          helper="${mount_dir}/Conjet.app/Contents/Library/LoginItems/Conjet Menu Bar.app"
          cmp "${mount_dir}/Conjet.app/${guest}" "${helper}/${guest}"
          native="Contents/Resources/ConjetTools/ConjetCoreVMM/NativeCore"
          for asset in Image conjet-memd conjet-reclaimd kernel.sha512 boot-image volume.tar.gz; do
            cmp "native-core-assets/${asset}" "${mount_dir}/Conjet.app/${native}/${asset}"
            cmp "${mount_dir}/Conjet.app/${native}/${asset}" "${mount_dir}/bin/ConjetCoreVMM/NativeCore/${asset}"
            cmp "${mount_dir}/Conjet.app/${native}/${asset}" "${helper}/${native}/${asset}"
          done
          diff -r native-core-assets/BootOCI "${mount_dir}/bin/ConjetCoreVMM/NativeCore/BootOCI"
          diff -r native-core-assets/BootOCI "${mount_dir}/Conjet.app/${native}/BootOCI"
          diff -r native-core-assets/BootOCI "${helper}/${native}/BootOCI"
          pins="${mount_dir}/Conjet.app/${native}/docker-client-pins.json"
          cmp benchmarks/scenarios/docker-comparison-v1.json "$pins"
          cmp "$pins" "${mount_dir}/bin/ConjetCoreVMM/NativeCore/docker-client-pins.json"
          cmp "$pins" "${helper}/${native}/docker-client-pins.json"
          (cd "${mount_dir}/bin/ConjetCoreVMM/NativeCore" && shasum -a 512 -c kernel.sha512)
          "${mount_dir}/bin/conjet" native --help
          test -x "${mount_dir}/Conjet.app/Contents/Resources/ConjetTools/ConjetCoreVMM/conjet-network"
          "${mount_dir}/bin/ConjetCoreVMM/conjet-network" --version
          /usr/bin/codesign --verify --deep --strict "${mount_dir}/Conjet.app"

      - name: Validate rendered Homebrew packages
        run: |
          set -euo pipefail
          dmg="$(find dist -maxdepth 1 -name 'conjet-*-macos-*.dmg' -print -quit)"
          sha="$(shasum -a 256 "${dmg}" | awk '{print $1}')"
          build-support/render-homebrew-formula.sh \
            "$(cat VERSION)" \
            "${sha}" \
            "${GITHUB_REPOSITORY:-omega13-engr/conjet}" \
            "$(uname -m)" > dist/conjet.rb
          build-support/render-homebrew-cask.sh \
            "$(cat VERSION)" \
            "${sha}" \
            "${GITHUB_REPOSITORY:-omega13-engr/conjet}" \
            "$(uname -m)" > dist/conjet-cask.rb
          ruby -c dist/conjet.rb
          ruby -c dist/conjet-cask.rb
          grep -q 'binary "bin/conjet"' dist/conjet-cask.rb
          grep -q 'binary "bin/conjetd"' dist/conjet-cask.rb

      - name: Build benchmark package
        run: swift build --package-path benchmarks

      - name: Test benchmark package
        run: swift test --package-path benchmarks
