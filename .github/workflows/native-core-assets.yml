name: Build native Core assets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-core-assets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install the static guest compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools linux-libc-dev e2fsprogs libarchive-tools
      - name: Test guest memory telemetry on a bounded thread stack
        run: bash guest/image/conjet-core/tests/test-conjet-memd-cgroup.sh
      - name: Build memory helpers and verify the kernel pin
        run: |
          set -euo pipefail
          uapi="$(mktemp -d "${RUNNER_TEMP}/conjet-uapi.XXXXXX")"
          ln -s /usr/include/linux /usr/include/asm-generic "/usr/include/$(gcc -print-multiarch)/asm" "$uapi/"
          CONJET_NATIVE_UAPI_DIR="$uapi" bash build-support/build-native-core-assets.sh native-core-assets
      - uses: actions/upload-artifact@v4
        with:
          name: conjet-native-core-assets
          path: native-core-assets/
          if-no-files-found: error
