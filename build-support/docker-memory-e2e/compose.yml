services:
  canary:
    image: ${CONJET_MEMORY_E2E_IMAGE:-conjet-memory-e2e:local}
    build:
      context: .
      target: runtime
    command: ["serve", "64"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "memory-fixture", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
  allocator:
    image: ${CONJET_MEMORY_E2E_IMAGE:-conjet-memory-e2e:local}
    command: ["serve", "64"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=16m
    mem_limit: 2g
    depends_on:
      canary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memory-fixture", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 3
