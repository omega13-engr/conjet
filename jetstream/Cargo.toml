[package]
name = "jetstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Conjet Jetstream microVM monitor for macOS Hypervisor.framework"
license = "UNLICENSED"

[[bin]]
name = "jetstream"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bitflags = "2.6"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
base64 = "0.22"
conjet-launch-service = { path = "../guest/launch-service" }
flate2 = "1"
sha2 = { version = "0.10", features = ["asm"] }
tar = { version = "0.4", default-features = false }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tempfile = "3.14"

[dev-dependencies]
tempfile = "3.14"

